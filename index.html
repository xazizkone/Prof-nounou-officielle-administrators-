<title>Prof Nounou · Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--violet:#6C47FF;--blue:#2F80ED;--ink:#1B1740;--mut:#6B6890;--bg:#F7F6FF;--line:#E7E4F7;--red:#D92D20;--grad:linear-gradient(135deg,#6C47FF,#2F80ED);--r:16px;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #A895FF;outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header .in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{font-size:18px;letter-spacing:-.01em}
header .out{color:#CFC8FF;font-size:14px;padding:6px 10px}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:9;overflow-x:auto}
nav .in{max-width:980px;margin:0 auto;display:flex;gap:4px;padding:0 10px}
nav button{padding:13px 14px;font-weight:600;color:var(--mut);white-space:nowrap;border-bottom:3px solid transparent;position:relative}
nav button.on{color:var(--violet);border-color:var(--violet)}
nav .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;margin-left:6px;line-height:20px;text-align:center}
h1{font-size:26px;letter-spacing:-.02em;margin:18px 0 4px}
h2{font-size:18px;margin:22px 0 10px}
.sub{color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .l{color:var(--mut);font-size:13px;margin-top:4px}
.stat.prof .v{color:#1D63D0}.stat.nounou .v{color:#5530E0}.stat.red .v{color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mut);gap:4px}
.bar i{display:block;width:100%;border-radius:8px 8px 0 0;background:var(--grad);min-height:3px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.row{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.row .t{flex:1;min-width:0}
.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.badge.prof{background:#E8F1FF;color:#1D63D0}.badge.nounou{background:#EFEAFF;color:#5530E0}.badge.client{background:#F0EFF7;color:var(--mut)}
.badge.bl{background:#FEE4E2;color:var(--red)}.badge.open{background:#FFF4E0;color:#B54708}.badge.done{background:#E7F6EC;color:#067647}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--grad);color:#fff}
.btn.ghost{background:#fff;color:var(--violet);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.sm{padding:8px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.back{color:var(--mut);font-weight:500;padding:12px 0;display:inline-block}
.err{background:#FFF0F0;color:#B42318;border-radius:12px;padding:10px 14px;margin-top:14px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.cv{white-space:pre-wrap;margin-top:8px}
.thread{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.b{max-width:80%;padding:9px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);word-wrap:break-word;white-space:pre-wrap}
.b.r{align-self:flex-end;background:#EFEAFF;border-color:#E0D8FF}
.b small{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.media{display:block;max-width:100%;width:260px;border-radius:10px;background:#EEE;min-height:50px}
.b audio{width:230px;max-width:100%}
.login{max-width:400px;margin:12vh auto 0;padding:0 18px}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin-top:10px;font-size:15px}
.kv span:nth-child(odd){color:var(--mut)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50}
</style>
</head>

/* ---------- connexion ---------- */
async function init() {
  const { data } = await sb.auth.getSession();
  if (data.session && await isAdmin()) return boot();
  loginView();
}
async function isAdmin() { const { data } = await sb.rpc('is_admin'); return data === true; }
function loginView(msg) {
  app.innerHTML = `<div class="login"><h1>Administration</h1><p class="sub">Prof Nounou · accès réservé</p>
    <label for="e">E-mail</label><input id="e" type="email" autocomplete="email">
    <label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <button class="btn" style="width:100%;margin-top:18px" onclick="login()">Se connecter</button></div>`;
}
async function login() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#e').value.trim(), password: $('#p').value });
  if (error) return loginView('E-mail ou mot de passe incorrect.');
  if (!(await isAdmin())) { await sb.auth.signOut(); return loginView("Ce compte n'est pas administrateur."); }
  boot();
}
async function logout() { await sb.auth.signOut(); loginView(); }

/* ---------- structure ---------- */
async function boot() {
  await loadUsers();
  app.innerHTML = `<header><div class="in"><b>Administration</b><button class="out" onclick="logout()">Déconnexion</button></div></header>
    <nav><div class="in" id="nav"></div></nav><div class="wrap" id="v"></div>`;
  go('dash');
}
async function loadUsers() {
  const { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(2000);
  A.users = data || []; A.map = {}; A.users.forEach(u => A.map[u.id] = u);
  const r = await sb.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'open');
  A.openReports = r.count || 0;
}
function drawNav() {
  const t = [['dash', 'Tableau de bord'], ['users', 'Utilisateurs'], ['reports', 'Signalements'], ['convs', 'Conversations']];
  $('#nav').innerHTML = t.map(([k, l]) => `<button class="${A.tab === k ? 'on' : ''}" onclick="go('${k}')">${l}${k === 'reports' && A.openReports ? `<span class="n">${A.openReports}</span>` : ''}</button>`).join('');
}
function go(t) {
  A.tab = t; drawNav(); window.scrollTo(0, 0);
  ({ dash: viewDash, users: viewUsers, reports: viewReports, convs: viewConvs })[t]();
}

/* ---------- tableau de bord ---------- */
async function viewDash() {
  $('#v').innerHTML = `<h1>Tableau de bord</h1><p class="sub">Chargement…</p>`;
  const { data: s, error } = await sb.rpc('admin_stats');
  if (error || !s) return $('#v').innerHTML = `<h1>Tableau de bord</h1><div class="err">Statistiques indisponibles : lancez le script SQL administrateur.</div>`;
  const st = (v, l, c = '') => `<div class="stat ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const days = s.daily || [], max = Math.max(1, ...days.map(d => d.u));
  $('#v').innerHTML = `<h1>Tableau de bord</h1><p class="sub">Vue d'ensemble du site.</p>
    <h2>Visiteurs</h2>
    <div class="stats">${st(s.visitors_today, "Visiteurs aujourd'hui")}${st(s.visits_today, "Visites aujourd'hui")}${st(s.visitors_total, 'Visiteurs au total')}${st(s.visits_total, 'Visites au total')}</div>
    <h2>Visiteurs uniques, 7 derniers jours</h2>
    <div class="card"><div class="bars">${days.length ? days.map(d => `<div class="bar"><span>${d.u}</span><i style="height:${Math.round(d.u / max * 100)}%"></i><span>${new Date(d.d).toLocaleDateString('fr', { weekday: 'short' })}</span></div>`).join('') : '<div class="empty" style="width:100%">Pas encore de visites.</div>'}</div></div>
    <h2>Comptes inscrits</h2>
    <div class="stats">${st(s.profs, 'Professeurs', 'prof')}${st(s.nounous, 'Nounous', 'nounou')}${st(s.clients, 'Clients')}${st(s.blocked, 'Comptes bloqués', 'red')}</div>
    <h2>Activité</h2>
    <div class="stats">${st(s.conversations, 'Conversations')}${st(s.messages, 'Messages')}${st(s.reports_open, 'Signalements ouverts', s.reports_open ? 'red' : '')}</div>
    <div class="btns"><button class="btn ghost" onclick="loadUsers().then(viewDash)">Actualiser</button></div>`;
}

/* ---------- utilisateurs ---------- */
function viewUsers() {
  $('#v').innerHTML = `<h1>Utilisateurs</h1><p class="sub">${A.users.length} comptes</p>
    <input id="uq" placeholder="Nom, ville, pays…" value="${esc(A.q)}" oninput="A.q=this.value;drawUsers()" style="margin-top:12px">
    <div class="chips">${[['all', 'Tous'], ['prof', 'Profs'], ['nounou', 'Nounous'], ['client', 'Clients'], ['blocked', 'Bloqués']].map(([k, l]) => `<button class="chip ${A.role === k ? 'on' : ''}" onclick="A.role='${k}';viewUsers()">${l}</button>`).join('')}</div>
    <div class="list" id="ul"></div>`;
  drawUsers();
}
function drawUsers() {
  const q = A.q.toLowerCase();
  const l = A.users.filter(u => (A.role === 'all' || (A.role === 'blocked' ? u.blocked : u.role === A.role)) && (!q || [u.full_name, u.city, u.country, u.subject, u.qualities].join(' ').toLowerCase().includes(q)));
  $('#ul').innerHTML = l.length ? l.map(u => `<button class="card row" onclick="userDetail('${u.id}')">${av(u)}<div class="t"><b>${esc(u.full_name)}</b><span class="sub" style="font-size:14px">${esc(u.city)}, ${esc(u.country)}</span></div>${bdg(u.role)}${u.blocked ? '<span class="badge bl">Bloqué</span>' : ''}</button>`).join('') : '<div class="empty">Aucun compte trouvé.</div>';
}
async function userDetail(id) {
  const u = A.map[id]; if (!u) return;
  A.from = A.tab;
  const { data: cv } = await sb.from('conversations').select('*').or(`client_id.eq.${id},seller_id.eq.${id}`).order('last_message_at', { ascending: false });
  $('#v').innerHTML = `<button class="back" onclick="go('${A.from}')">← Retour</button>
    <div class="card"><div class="row">${av(u)}<div class="t"><b style="font-size:18px">${esc(u.full_name)}</b>${bdg(u.role)} ${u.blocked ? '<span class="badge bl">Bloqué</span>' : ''}</div></div>
      <div class="kv"><span>Lieu</span><span>${esc(u.city)}, ${esc(u.country)}</span>
      ${u.subject ? `<span>Matière</span><span>${esc(u.subject)}</span>` : ''}${u.qualities ? `<span>Qualités</span><span>${esc(u.qualities)}</span>` : ''}
      <span>Inscrit le</span><span>${fmtD(u.created_at)}</span>
      ${u.blocked && u.blocked_reason ? `<span>Motif du blocage</span><span>${esc(u.blocked_reason)}</span>` : ''}</div>
      ${u.cv_text ? `<h2>CV</h2><p class="cv">${esc(u.cv_text)}</p>` : ''}
      ${u.cv_path ? `<div class="btns"><button class="btn ghost sm" onclick="openCv('${esc(u.cv_path)}')">Ouvrir le CV en PDF</button></div>` : ''}
      <div class="btns">${u.blocked ? `<button class="btn" onclick="setBlock('${u.id}',false)">Débloquer le compte</button>` : `<button class="btn red" onclick="setBlock('${u.id}',true)">Bloquer le compte</button>`}</div></div>
    <h2>Conversations (${cv ? cv.length : 0})</h2>
    <div class="list">${cv && cv.length ? cv.map(c => convRow(c)).join('') : '<div class="empty">Aucune conversation.</div>'}</div>`;
}
async function setBlock(id, on) {
  let reason = null;
  if (on) { reason = prompt('Motif du blocage (affiché à la personne) :', 'Non-respect des règles du site'); if (reason === null) return; }
  const { error } = await sb.from('profiles').update({ blocked: on, blocked_reason: on ? (reason.trim() || null) : null }).eq('id', id);
  if (error) return toast('Action impossible : ' + error.message);
  await loadUsers(); toast(on ? 'Compte bloqué' : 'Compte débloqué'); drawNav();
  if (A.tab === 'reports') viewReports(); else userDetail(id);
}
async function openCv(path) {
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from('cvs').createSignedUrl(path, 3600);
  if (error) { if (w) w.close(); return toast('CV indisponible'); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

/* ---------- signalements ---------- */
async function viewReports() {
  $('#v').innerHTML = `<h1>Signalements</h1><p class="sub">Chargement…</p>`;
  let q = sb.from('reports').select('*').order('created_at', { ascending: false }).limit(200);
  if (!A.repAll) q = q.eq('status', 'open');
  const { data } = await q;
  $('#v').innerHTML = `<h1>Signalements</h1>
    <div class="chips"><button class="chip ${!A.repAll ? 'on' : ''}" onclick="A.repAll=false;viewReports()">À traiter</button><button class="chip ${A.repAll ? 'on' : ''}" onclick="A.repAll=true;viewReports()">Tous</button></div>
    <div class="list">${data && data.length ? data.map(r => { const u = A.map[r.reported_id]; return `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="sub" style="font-size:13px">${fmtD(r.created_at)}</span><span class="badge ${r.status}">${r.status === 'open' ? 'À traiter' : 'Traité'}</span></div>
      <p style="margin-top:6px"><b>${esc(nm(r.reporter_id))}</b> signale <b>${esc(nm(r.reported_id))}</b> ${u ? bdg(u.role) : ''} ${u && u.blocked ? '<span class="badge bl">Bloqué</span>' : ''}</p>
      <p class="cv">${esc(r.reason)}</p>
      <div class="btns"><button class="btn ghost sm" onclick="userDetail('${r.reported_id}')">Voir le compte</button>
      ${u && !u.blocked ? `<button class="btn red sm" onclick="setBlock('${r.reported_id}',true)">Bloquer</button>` : ''}
      ${r.status === 'open' ? `<button class="btn ghost sm" onclick="closeReport('${r.id}')">Marquer comme traité</button>` : ''}</div></div>`; }).join('') : '<div class="empty">Aucun signalement.</div>'}</div>`;
}
async function closeReport(id) { await sb.from('reports').update({ status: 'done' }).eq('id', id); await loadUsers(); drawNav(); viewReports(); }

/* ---------- conversations ---------- */
function convRow(c) {
  return `<button class="card row" onclick="openThread('${c.id}')"><div class="t"><b>${esc(nm(c.client_id))} ↔ ${esc(nm(c.seller_id))}</b><span class="sub" style="font-size:14px">Dernier message : ${fmtD(c.last_message_at)}</span></div></button>`;
}
async function viewConvs() {
  $('#v').innerHTML = `<h1>Conversations</h1><p class="sub">Toutes les conversations du site.</p>
    <input placeholder="Rechercher un nom…" value="${esc(A.cq)}" oninput="A.cq=this.value;drawConvs()" style="margin-top:12px"><div class="list" id="cl"><div class="empty">Chargement…</div></div>`;
  const { data } = await sb.from('conversations').select('*').order('last_message_at', { ascending: false }).limit(500);
  A.convs = data || []; drawConvs();
}
function drawConvs() {
  const q = A.cq.toLowerCase();
  const l = A.convs.filter(c => !q || (nm(c.client_id) + ' ' + nm(c.seller_id)).toLowerCase().includes(q));
  $('#cl').innerHTML = l.length ? l.map(convRow).join('') : '<div class="empty">Aucune conversation.</div>';
}
const URLS = {};
async function hydrate() {
  document.querySelectorAll('[data-path]:not([data-ok])').forEach(async el => {
    el.dataset.ok = '1'; const p = el.dataset.path;
    if (!URLS[p]) { const { data } = await sb.storage.from('chat').createSignedUrl(p, 3600); if (data) URLS[p] = data.signedUrl; }
    if (URLS[p]) el.src = URLS[p]; else el.outerHTML = '<span class="sub">Média indisponible</span>';
  });
}
async function openThread(cid) {
  A.from = A.tab;
  const c = (A.convs || []).find(x => x.id === cid) || (await sb.from('conversations').select('*').eq('id', cid).maybeSingle()).data;
  if (!c) return;
  const { data: ms } = await sb.from('messages').select('*').eq('conversation_id', cid).order('created_at');
  const body = m => {
    if (m.kind === 'image') return `<img class="media" data-path="${esc(m.content)}" alt="Image" onclick="if(this.src)window.open(this.src,'_blank')">`;
    if (m.kind === 'clip') return `<video class="media" data-path="${esc(m.content)}" controls playsinline preload="metadata"></video>`;
    if (m.kind === 'audio') return `<audio data-path="${esc(m.content)}" controls preload="metadata"></audio>`;
    if (m.kind === 'video') return '<i>Appel vidéo lancé</i>';
    return esc(m.content);
  };
  const cb = A.map[c.client_id], sl = A.map[c.seller_id];
  $('#v').innerHTML = `<button class="back" onclick="go('${A.from === 'convs' || A.from === 'dash' ? 'convs' : A.from}')">← Retour</button>
    <div class="card"><b>${esc(nm(c.client_id))}</b> ${cb ? bdg(cb.role) : ''} ↔ <b>${esc(nm(c.seller_id))}</b> ${sl ? bdg(sl.role) : ''}
      <div class="btns"><button class="btn ghost sm" onclick="userDetail('${c.client_id}')">Compte du client</button><button class="btn ghost sm" onclick="userDetail('${c.seller_id}')">Compte du vendeur</button></div></div>
    <div class="thread">${ms && ms.length ? ms.map(m => `<div class="b ${m.sender_id === c.seller_id ? 'r' : ''}"><small>${esc(nm(m.sender_id))} · ${fmtD(m.created_at)}</small>${body(m)}</div>`).join('') : '<div class="empty">Aucun message.</div>'}</div>`;
  hydrate();
}

init();
</script>
</body>
</html>
